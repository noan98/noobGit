[package]
name = "noobgit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ジュニアエンジニアが安心して使えるGitツール noobGit のコアロジック"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
git2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { version = "1", features = ["yaml", "redactions"] }
tempfile = "3"
# ランダム操作列に対する undo / ジャーナルの不変条件検証（undo/proptests.rs）。
proptest = "1"
# html_reports 用の plotters や並列実行用の rayon は使わないため、必要最小限の
# cargo_bench_support だけを有効化する（`cargo bench` からの実行・テキスト出力に必要）。
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "repo_bench"
harness = false
