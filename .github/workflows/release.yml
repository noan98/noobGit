# CD: バージョンタグ(v*)のpushで Windows用インストーラ(.exe/.msi)を
# ビルドし、GitHub Releaseに添付する。noobGitの対象はWindowsのため
# windows-latest でのみビルドする。アクションはコミットSHAで固定する。
name: release

on:
  push:
    tags:
      - 'v*'
  # 成果物の添付だけをやり直したいとき用。対象のタグを明示して実行する。
  workflow_dispatch:
    inputs:
      tag:
        description: '対象のバージョンタグ（例: v0.1.5）'
        required: true
        type: string

# tauri-action がReleaseを作成・更新するために書き込み権限が要る。
permissions:
  contents: write

jobs:
  release:
    name: Build Windows installers
    runs-on: windows-latest
    env:
      # push 時はタグ名、手動実行時は入力されたタグ名を使う。
      # （workflow_dispatch の github.ref_name はブランチ名なので使えない）
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # リリースのバージョンはタグから決める。手でマニフェストの version を
      # 上げ忘れても、インストーラ名（noobGit_X.Y.Z_x64-setup.exe）や
      # インストーラが名乗るバージョンがタグとずれないようにする。
      # 書き換えるのはこのチェックアウト内だけで、リポジトリにはコミットしない。
      - name: Apply version from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::タグ '${TAG_NAME}' が vX.Y.Z 形式ではありません。リリースのバージョンを決められないので中断します。"
            exit 1
          fi
          # 成果物のバージョンは tauri.conf.json の version が決める。
          # 整形が変わらないよう version の行だけを置き換え、書き換え後に
          # JSON として読み直して値が入ったことを確認する。
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const version = process.argv[1];
            const before = fs.readFileSync(path, "utf8");
            let replaced = 0;
            const after = before.replace(
              /^(\s*"version":\s*)"[^"]*"/m,
              (_, head) => { replaced += 1; return head + JSON.stringify(version); },
            );
            if (replaced !== 1) {
              throw new Error(`${path} の version を書き換えられませんでした`);
            }
            fs.writeFileSync(path, after);
            if (JSON.parse(fs.readFileSync(path, "utf8")).version !== version) {
              throw new Error(`${path} の version が ${version} になっていません`);
            }
          ' "$version"
          # package.json / package-lock.json も揃えておく（npm 側の表示用）。
          npm version "$version" --no-git-tag-version --allow-same-version > /dev/null
          echo "バージョンを ${version} に設定しました（タグ ${TAG_NAME} 由来）。"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install frontend deps
        run: npm ci

      # tauri-action は「同じタグの **ドラフト** Release」しか探さない。
      # GitHub の UI から先に Release を公開してタグを作った場合、既存の
      # 公開済み Release を見つけられず、同じタグでもう1つ別のドラフトを
      # 作ってそちらにインストーラを添付してしまう（公開側は成果物ゼロの
      # まま＝「ビルドは成功したのに成果物が見当たらない」状態）。
      # 先に公開済み Release の ID を解決し、見つかれば releaseId で明示的に
      # 添付先を指定する。見つからなければ空のままにして、これまで通り
      # tauri-action にドラフトを作らせる。
      - name: Resolve existing release
        id: existing_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.id'); then
            echo "公開済みの Release を見つけました (id=${id})。ここに成果物を添付します。"
          else
            id=''
            echo "公開済みの Release はありません。tauri-action にドラフトを作らせます。"
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 空文字なら tauri-action 側の tagName ベースの探索にフォールバックする。
          releaseId: ${{ steps.existing_release.outputs.id }}
          tagName: ${{ env.TAG_NAME }}
          releaseName: 'noobGit ${{ env.TAG_NAME }}'
          releaseDraft: true
          prerelease: false
