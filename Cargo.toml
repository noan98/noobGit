[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/noan98/noobgit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# git2 0.21 から default features が空になったため、SSH / HTTPS の両トランスポートを
# 明示的にオプトインする。これを外すと fetch / pull / push がリモートに接続できなくなる。
# （0.20 までは default = ["ssh", "https", "ssh_key_from_memory"] だった。
#   ssh_key_from_memory は本体では未使用で、0.21 で feature 自体が廃止されている。）
git2 = { version = "0.21", features = ["ssh", "https"] }
thiserror = "2"
